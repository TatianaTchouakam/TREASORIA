name: CI

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "assets/**"
      - "data/**"
      - "evaluation/**"
      - "streamlit_app.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "assets/**"
      - "data/**"
      - "evaluation/**"
      - "streamlit_app.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  lint-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # If the RAG part eventually needs a real API call in CI, add the secret
    # via repo Settings > Secrets and variables > Actions, then uncomment:
    # env:
    #   OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format . --check

      - name: Syntax/import check across src
        run: python -m compileall -q src

      - name: Syntax check Streamlit app
        run: python -m py_compile streamlit_app.py

      - name: Run tests (if any exist)
        run: |
          if find tests -name "test_*.py" -o -name "*_test.py" 2>/dev/null | grep -q .; then
            pip install pytest
            pytest -q
          else
            echo "No tests found yet, skipping."
          fi